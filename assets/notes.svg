<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336" width="560" height="336" role="img" aria-label="Principles. Systems over motivation: Tokens, scales and constraints that produce consistent output on a bad day. Constraints create clarity: Limited hardware and limited scope are design parameters, not obstacles. Evidence over intuition: Look at the rendered result, measure it, then change it."><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}.se{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif}
.t{fill:#0B0F10}.m{fill:#4B5A58}.a{fill:#3F6212}.as{stroke:#3F6212}
.h{stroke:#D3E2DF}.g{stroke:#0B0F10;stroke-opacity:.09}.ar{fill:#3F6212;fill-opacity:.1}
@media (prefers-color-scheme:dark){.t{fill:#EEF6F4}.m{fill:#8A9593}.a{fill:#C5F36B}.as{stroke:#C5F36B}
.h{stroke:#232B30}.g{stroke:#EEF6F4;stroke-opacity:.08}.ar{fill:#C5F36B;fill-opacity:.1}}
.curve{stroke-dasharray:1;animation:draw 2.6s cubic-bezier(.3,.6,.2,1) .2s backwards}
.area{animation:fade 1.4s ease 1.7s backwards}
.n{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.3,1.6,.5,1) backwards}
.r{transform-box:fill-box;transform-origin:center;animation:ring 3.6s ease-out infinite}
.l{animation:fade .8s ease backwards}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(0);opacity:0}}
@keyframes ring{0%{transform:scale(.6);opacity:.5}70%,100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><text x="0" y="38" font-size="13" font-weight="600" letter-spacing="1" class="mo a">I</text><text x="40" y="40" font-size="21" font-weight="650" letter-spacing="-.3" class="t">Systems over motivation</text><text x="40" y="68" font-size="15" class="m">Tokens, scales and constraints that produce</text><text x="40" y="90" font-size="15" class="m">consistent output on a bad day.</text><line x1="0" y1="111.5" x2="560" y2="111.5" class="h" stroke-width="1"/><text x="0" y="150" font-size="13" font-weight="600" letter-spacing="1" class="mo a">II</text><text x="40" y="152" font-size="21" font-weight="650" letter-spacing="-.3" class="t">Constraints create clarity</text><text x="40" y="180" font-size="15" class="m">Limited hardware and limited scope are design</text><text x="40" y="202" font-size="15" class="m">parameters, not obstacles.</text><line x1="0" y1="223.5" x2="560" y2="223.5" class="h" stroke-width="1"/><text x="0" y="262" font-size="13" font-weight="600" letter-spacing="1" class="mo a">III</text><text x="40" y="264" font-size="21" font-weight="650" letter-spacing="-.3" class="t">Evidence over intuition</text><text x="40" y="292" font-size="15" class="m">Look at the rendered result, measure it,</text><text x="40" y="314" font-size="15" class="m">then change it.</text><line x1="0" y1="335.5" x2="560" y2="335.5" class="h" stroke-width="1"/></svg>