<svg xmlns="http://www.w3.org/2000/svg" width="880" height="104" viewBox="0 0 880 104" role="img" aria-label="I design and build web interfaces as a single system, so the result feels inevitable rather than assembled."><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.t{fill:#1F2328}.m{fill:#656D76}.pf{fill:#F6F8FA;stroke:#D0D7DE}.hl{stroke:#D0D7DE}.sf{fill:#1F2328}.st{fill:#FFF}@media (prefers-color-scheme:dark){.t{fill:#E6EDF3}.m{fill:#8B949E}.pf{fill:#161B22;stroke:#30363D}.hl{stroke:#30363D}.sf{fill:#E6EDF3}.st{fill:#0D1117}}</style><text x="440" y="48" text-anchor="middle" font-size="22" letter-spacing="-0.2" class="t">I design and build web interfaces as a single system,</text><text x="440" y="80" text-anchor="middle" font-size="22" letter-spacing="-0.2" class="t">so the result feels inevitable rather than assembled.</text></svg>